name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Read version
        id: meta
        shell: pwsh
        run: |
          $name = python -c "import app; print(app.APP_NAME)"
          $version = python -c "import app; print(app.APP_VERSION)"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match APP_VERSION $version in app/__init__.py"
          }
          "name=$name" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: pwsh
        run: ./scripts/build.ps1 -OneFile -Zip

      - name: Checksums
        id: files
        shell: pwsh
        run: |
          $zip = "dist/${{ steps.meta.outputs.name }}-${{ steps.meta.outputs.version }}-windows-x64.zip"
          $exe = "dist/${{ steps.meta.outputs.name }}.exe"
          $lines = foreach ($file in @($zip, $exe)) {
            "{0}  {1}" -f (Get-FileHash $file -Algorithm SHA256).Hash.ToLower(), (Split-Path $file -Leaf)
          }
          $lines | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "exe=$exe" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}-${{ steps.meta.outputs.version }}
          path: |
            ${{ steps.files.outputs.zip }}
            ${{ steps.files.outputs.exe }}
            dist/SHA256SUMS.txt

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.meta.outputs.name }} ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ steps.files.outputs.zip }}
            ${{ steps.files.outputs.exe }}
            dist/SHA256SUMS.txt
          body: |
            ## Download
            Download **${{ steps.meta.outputs.name }}-${{ steps.meta.outputs.version }}-windows-x64.zip**, extract it and run `${{ steps.meta.outputs.name }}.exe` — no installation needed (Windows 10/11, 64-bit).

            دانلود فایل zip، خارج کردن از حالت فشرده و اجرای `${{ steps.meta.outputs.name }}.exe` — بدون نیاز به نصب.

            > If Windows SmartScreen appears, click **More info → Run anyway** (the EXE is not code-signed).

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
